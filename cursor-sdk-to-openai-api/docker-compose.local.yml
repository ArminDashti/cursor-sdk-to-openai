# Local Docker hot-reload for cursor-sdk-to-openai (API + WebUI).
# Open URL: http://pc-armin/cursor-sdk-to-openai/
# stack_name / compose project: cursor-sdk-to-openai
services:
  api:
    image: node:22-bookworm
    restart: "no"
    working_dir: /app
    env_file:
      - .env
    environment:
      HOST: "0.0.0.0"
      PORT: "8140"
      DATABASE_PATH: /app/data/cursor-sdk-to-openai.db
      UPLOAD_DIR: /app/data/uploads
      WEBUI_ORIGIN: "http://pc-armin,http://127.0.0.1:5173,http://localhost:5173"
      CHOKIDAR_USEPOLLING: "true"
    command:
      - sh
      - -c
      - npm install && npm run dev
    volumes:
      - .:/app
      - cursor-sdk-to-openai-api-node-modules:/app/node_modules
      - cursor-sdk-to-openai-data:/app/data
    ports:
      - "8173:8140"
    networks:
      - default
      - pc-armin-local

  webui:
    image: node:22-bookworm
    restart: "no"
    working_dir: /app
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      VITE_BASE: /cursor-sdk-to-openai/
      VITE_HOST: "0.0.0.0"
      VITE_PORT: "5173"
      VITE_API_BASE: http://pc-armin/cursor-sdk-to-openai-api
    command:
      - sh
      - -c
      - npm install && npm run dev -- --host 0.0.0.0 --port 5173 --strictPort --base /cursor-sdk-to-openai/
    volumes:
      - ../cursor-sdk-to-openai-webui:/app
      - cursor-sdk-to-openai-webui-node-modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api
    networks:
      - default
      - pc-armin-local

networks:
  pc-armin-local:
    external: true

volumes:
  cursor-sdk-to-openai-api-node-modules:
  cursor-sdk-to-openai-webui-node-modules:
  cursor-sdk-to-openai-data:
